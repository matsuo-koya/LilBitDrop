# Drop-in for airbridge-awdl.service
# - only one filin at a time (guard), retries forever instead of hitting the start limit
# - filin sync-mode flags come from FILIN_EXTRA_ARGS (override it in /etc/airbridge.conf;
#   set FILIN_EXTRA_ARGS= (empty) to go back to the default force-master behaviour)
[Unit]
StartLimitIntervalSec=0
# Fix the adapter's "no IR" state (driver reload) before filin opens it.
Wants=airbridge-radio.service
After=airbridge-radio.service

[Service]
Environment=FILIN_EXTRA_ARGS=--no-force-master
ExecStartPre=/opt/airbridge/bin/filin-guard.sh
ExecStart=
ExecStart=/opt/airbridge/bin/filin -i ${WIFI_IFACE} -c ${AWDL_CHANNEL} -h ${AWDL_IFACE} $FILIN_EXTRA_ARGS
