# Follow the AWDL cluster's timing but advertise/follow AirBridge's own
# channel sequence (44 everywhere, ch6 in slot 8) instead of copying the sync
# parent's, which churns every few seconds. With it the receiver shows up in
# the iPhone picker within seconds and stays listed (2026-10-08 test).
[Service]
Environment=FILIN_OWN_SEQUENCE=1
