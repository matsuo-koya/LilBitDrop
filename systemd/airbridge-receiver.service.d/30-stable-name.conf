# Stable AirDrop identity: the picker name (ReceiverComputerName) and the mDNS
# instance no longer change on every restart, so Apple devices don't show
# stale "luftlift-<pid>" ghosts next to the live receiver.
[Service]
Environment=LUFTLIFT_INSTANCE=lilbitdrop
ExecStart=
ExecStart=/opt/airbridge/bin/luftlift -i ${AWDL_IFACE} receive -o ${INCOMING_DIR} --name LilBitDrop
