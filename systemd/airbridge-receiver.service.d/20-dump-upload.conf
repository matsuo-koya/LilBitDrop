# Diagnostic: keep each raw /Upload body (decrypted HTTP body, before dvzip/cpio decode)
# so decode failures can be analysed offline. Contains the received file itself:
# root-only directory, delete after analysis. Remove this drop-in when not debugging.
[Service]
Environment=LUFTLIFT_DUMP_UPLOAD=/var/lib/airbridge/upload-dumps
ExecStartPre=/usr/bin/install -d -m 700 /var/lib/airbridge/upload-dumps
