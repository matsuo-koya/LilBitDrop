# LilBitDrop runtime configuration
WIFI_IFACE=wlan1
AWDL_CHANNEL=44
AWDL_IFACE=awdl0
INCOMING_DIR=/var/lib/airbridge/incoming
USB_IFACE=usb0
USB_ADDRESS=10.55.0.1/24
WEB_BIND="10.55.0.1 10.56.0.1"
WEB_PORT=8080
OPENDROP_DIR=/opt/airbridge/opendrop-rs
# Wi-Fi access point on the built-in radio (airbridge-ap). The passphrase is
# generated into /etc/airbridge-ap.psk on first start.
AP_IFACE=uap0
AP_SSID=LilBitDrop
AP_ADDRESS=10.56.0.1/24
